# O Grimorio nao guarda o baralho: o estado (deck, mao, descarte) vive em
# flags do ATOR, sob homebrew.cartas. O item so liga a aba - ver
# "Grimorio das Cartas" em homebrew/homebrew.mjs e no README.
_id: hbGrimorioCartas
name: 'Grimório das Cartas'
