# PV e PM do Artifice do Sumie.
#
# Alvo da classe: 14 + CON no nivel 1, depois 4 + CON por nivel; 5 PM por nivel.
#
# PV. O sistema soma pvPorNivel por nivel e acrescenta CON sozinho; com a caixa
# "Classe Inicial" marcada o nivel 1 vale 4 x pvPorNivel. Com pvPorNivel = 4:
#
#   inicial marcada    -> 4*4 + 4*(N-1) + N*CON = 4N + 12 + N*CON
#   alvo               -> 14 + CON + (N-1)*(4+CON) = 4N + 10 + N*CON
#
# Sobram 2 PV com a caixa marcada, e faltam 10 com ela desmarcada - os dois
# casos da formula geral (P1 - 4p e P1 - p) anotada em AJUSTE_PV no
# homebrew.mjs. Como o ajuste muda conforme a caixa, ele nao pode ser um
# ActiveEffect estatico aqui: quem cuida disso e sincronizarPV.
#
# PM. O sistema soma so pmPorNivel, sem atributo nenhum, e a classe pede
# exatamente 5 PM por nivel. Nada a corrigir - Inteligencia e atributo-chave
# da classe (CD e pericias), mas o material nao soma Int aos PM.
#
# Pericias: "6 + Inteligencia". O +Int e regra geral de T20, aplicada pelo
# sistema a qualquer personagem, e nao parte da classe - por isso numero: 6,
# igual ao que as classes oficiais fazem (ver Bardo, tambem 6).
#
# Proficiencias, atributo-chave, CD e Kit de Sumie ficam no texto: ClassData
# (tormenta20.mjs:18053) so define niveis, pvPorNivel, pmPorNivel, pericias e
# inicial. Qualquer chave nova seria descartada em silencio ao salvar.
