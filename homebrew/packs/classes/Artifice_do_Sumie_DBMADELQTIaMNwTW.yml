system:
  description:
    value: '<p>O Artífice do Sumiê transforma arte em realidade. Utilizando tinta ritualística, pergaminhos e pincéis espirituais, ele cria criaturas, selos, paisagens e manifestações vivas capazes de alterar completamente o campo de batalha. Sua função é Controle, Invocação, Suporte e Utilidade.</p><p><strong>Atributo-chave:</strong> Inteligência. <strong>CD das habilidades:</strong> 10 + metade do nível + Inteligência.</p><p><strong>Proficiências:</strong> armas simples e armaduras leves. Usa um <strong>Kit de Sumiê</strong> para traçar suas fórmulas.</p><p>O poder da classe vem das <strong>Fórmulas de Sumiê</strong>, divididas em quatro caminhos — <em>Bestiário</em> (invocações de tinta), <em>Caligrafia</em> (selos e kanji), <em>Paisagismo</em> (terreno pintado) e <em>Herborizo</em> (cura e sustento) — e em cinco Tiers.</p><hr><p><em>O material de origem não traz tabela de progressão por nível, nem custo, execução, duração ou alcance das fórmulas. A escada de Tier usada nos itens deste compêndio (Tier I no 1º nível a 1 PM, II no 5º a 2 PM, III no 9º a 3 PM, IV no 13º a 4 PM, V no 17º a 5 PM) é uma proposta desta camada, não regra da fonte. Veja "Artífice do Sumiê" no README.</em></p>'
