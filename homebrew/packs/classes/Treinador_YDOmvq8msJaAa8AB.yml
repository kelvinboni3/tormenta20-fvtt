# PV e PM do Treinador.
#
# Alvo da classe: 12 + CON no nivel 1, depois 3 + CON por nivel; 4 PM por nivel.
#
# PV. O sistema soma pvPorNivel por nivel e acrescenta CON sozinho; com a caixa
# "Classe Inicial" marcada o nivel 1 vale 4 x pvPorNivel. Com pvPorNivel = 3:
#
#   inicial marcada    -> 4*3 + 3*(N-1) + N*CON = 3N + 9 + N*CON
#   alvo               -> 12 + CON + (N-1)*(3+CON) = 3N + 9 + N*CON
#
# Os dois sao identicos: o Treinador NAO precisa de ajuste de PV com a caixa
# marcada - diferente do Vidente, cujo PV inicial (16) nao e multiplo de
# pvPorNivel. Com a caixa desmarcada faltam +9, e disso cuida sincronizarPV
# em homebrew.mjs.
#
# PM. O sistema soma so pmPorNivel, sem atributo nenhum, e a classe pede
# exatamente 4 PM por nivel. Nada a corrigir - por isso nao ha ActiveEffect
# aqui, ao contrario do item de classe do Vidente.
