effects:
  # PV: o sistema ja soma CON por nivel sozinho, entao pvPorNivel=5 da "5 + CON"
  # por nivel. Falta so a diferenca do nivel 1, que deveria ser 16 + CON: um
  # bonus fixo de +11 no total acerta TODOS os niveis de uma vez
  # (5*N + 11 + N*CON = 16 + CON + (N-1)*(5 + CON)), sem depender do campo
  # "inicial" - cuja regra no sistema e "nivel 1 vale 4x pvPorNivel", que nao
  # consegue expressar 16 inicial com 5 por nivel.
  #
  # PM: o sistema NAO soma atributo nenhum no PM. bonus.nivel entra dentro do
  # laco por nivel, entao "@sab" ali da exatamente "5 + SAB" por nivel.
