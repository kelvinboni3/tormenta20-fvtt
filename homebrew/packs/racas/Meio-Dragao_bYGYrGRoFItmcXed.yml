# Raca Meio-Dragao.
#
# Atributos. O material nao da modificador fixo nenhum: da "+2 em um atributo
# a sua escolha". Isso vive em atributosDinamicos.description, que e texto
# livre lido na criacao do personagem - os seis campos de `atributos` ficam
# em 0 porque RaceData (tormenta20.mjs:18112) os exige todos.
#
# Grants. Apenas as 4 habilidades de 1o nivel entram aqui: um grant de raca e
# aplicado inteiro na criacao do personagem, e as outras 21 habilidades so
# aparecem em niveis mais altos. Quem cuida delas e sincronizarMeioDragao em
# homebrew.mjs, que acrescenta e remove itens conforme o nivel muda.
#
# Pericias. Percepcao e Intimidacao sao treinadas de graca. Nenhuma das 18
# racas oficiais usa o campo `skills`, entao isso vai como ActiveEffect com
# OVERRIDE em system.pericias.<id>.treinado, que e a chave que o proprio
# sistema usa (tormenta20.mjs).
#
# Tipo de criatura. O material diz que o Meio-Dragao conta como criatura do
# tipo Dragao. RaceData nao tem campo para isso, entao ficou na descricao.
_id: bYGYrGRoFItmcXed
name: 'Meio-Dragão'
type: race
