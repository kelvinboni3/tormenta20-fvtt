system:
  description:
    value: '<p>Os Meio-Dragões não são humanoides que herdaram sangue dracônico. Eles são dragões verdadeiros que nasceram em uma forma humanoide. Embora não possuam o tamanho colossal de seus ancestrais, carregam em suas veias o mesmo poder, instinto e natureza dos grandes dragões. Conforme amadurecem, seu corpo desenvolve características cada vez mais próximas de sua forma original, até que finalmente sejam capazes de manifestar sua verdadeira natureza dracônica.</p><p><strong>Tipo:</strong> você é uma criatura do tipo <strong>Dragão</strong>. Efeitos que afetam dragões também afetam você.</p><p><strong>Atributos:</strong> +2 em um atributo à sua escolha.</p><p><strong>Perícias:</strong> você é treinado em Percepção e Intimidação.</p><p><strong>Visão no Escuro:</strong> alcance curto (18m).</p><hr><p><em>As 25 habilidades raciais destravam ao longo dos níveis 1, 2, 3, 5, 7, 9, 13, 15 e 18. A camada homebrew acrescenta cada uma à ficha quando você alcança o nível — veja "Raça Meio-Dragão" no README.</em></p>'
